server {
    listen 80;

    # Sirve la página web (index.html)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Reenvía /api/... al contenedor de la API ("api" es el nombre del servicio
    # en docker-compose.yml). Así el frontend y la API se comunican por la red de Docker.
    location /api/ {
        proxy_pass http://api:8000/;
    }
}
